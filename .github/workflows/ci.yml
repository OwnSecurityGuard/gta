name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # pcap 采集层无构建标签，Linux 上需要 libpcap 头文件（cgo）。
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -tags pcap ./...

  readme-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # 钉死 README 工具表与 cmd/gta-mcp/main.go 的 AddTool 一致。
      - name: Regenerate tool table
        run: go run ./scripts/gen_tool_table
      - name: No drift
        run: git diff --exit-code README.md
