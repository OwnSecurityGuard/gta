# gametrace.yaml —— gametrace 统一配置文件示例（T10/T11）。
#
# 用法：gt-pipeline -config /path/to/gametrace.yaml（gt-mcp 同样支持 -config）。
# 文件完全可选：不提供时一切取默认值，行为与历史版本一致。
#
# 每个字段的优先级均为：flag（显式传入） > 环境变量 GT_* > 本文件 > 默认值。
# 环境变量对照：GT_WORKDIR / GT_MCP_ADDR / GT_MCP_ALLOWED_ORIGINS /
#   GT_CONTROL_ADDR / GT_REGISTRY_ADDR / GT_AGENT_INGEST_ADDR / GT_PROXY_SERVER_ADDR。
#
# 注意：鉴权 token 不进配置文件——GT_AUTH_TOKENS 仅支持环境变量，避免密钥落盘。
#
# 各监听地址均支持 ":0" 动态分配端口；实际地址启动后回写
# <workdir>/addr.<name>.json（addr.mcp / addr.control / addr.registry /
# addr.agent-ingest），同机可据此跑多套实例。

# 工作目录：省略时按 显式flag > GT_HOME > 此字段 > CWD 既有数据沿用 > ~/.gametrace 解析。
workdir: ""
mcp:
  # gt-mcp 的 HTTP/SSE 监听地址。
  addr: ":8781"
  # CORS 允许的跨域 Origin（逗号分隔）；留空不返回 CORS 头。
  allowed_origins: ""
pipeline:
  # CaptureControl gRPC 监听地址（gt-mcp 的 -pipeline-addr 应指向这里）。
  # 注意：若设为 ":0" 动态分配，gt-mcp 无法自动发现端口——需人工读取
  # <workdir>/addr.control.json 中回写的实际地址，再作为 -pipeline-addr 传入。
  control_addr: ":9888"
  # PluginRegistry gRPC 监听地址（插件用 GT_REGISTRY_ADDR 注册）。
  registry_addr: ":9091"
  # AgentIngest gRPC 监听地址（gt-agent 推送原始帧入口）；留空用默认 :9092。
  agent_ingest_addr: ":9092"
proxy:
  # mobile Source 的 gRPC 监听地址（T11）：proxy.json 未指定 server_addr 时生效，
  # 最终兜底 127.0.0.1:9090。
  server_addr: "127.0.0.1:9090"
