syntax = "proto3";

package gametrace.mobile;

option go_package = "gametrace/pkg/capture/mobile/proto";

// MobileCapture 由 gt-pipeline 的 mobile capture source 提供（gRPC server）。
// gt-singbox-agent（sing-box 侧）作为 client 连接并推送连接级流量。
// 全连接共用一条流，靠 conn_id 区分；服务端按 (conn_id, direction) 归组，
// 但**不做**应用层分帧/重组——每个数据块原样透传为 packet，帧边界由解码插件判定。
service MobileCapture {
  // Push 客户端流式推送 AgentEvent；结束返回汇总统计。
  // 一条连接的两个方向是独立的字节流，direction 用于区分。
  rpc Push(stream AgentEvent) returns (PushResult);
}

// AgentEvent 是 agent → source 的单一事件流，按 conn_id 组织。
message AgentEvent {
  string conn_id = 1;          // 连接唯一标识（agent 生成，同一条连接保持一致）
  int64 timestamp_unix = 2;    // 事件时间戳（Unix 秒）；0 表示使用接收时刻
  oneof event {
    ConnOpen open = 10;
    ConnData data = 11;
    ConnClose close = 12;
  }
}

// ConnOpen 连接建立：携带连接元数据，应在同 conn_id 的 data 之前发送。
message ConnOpen {
  string client_addr = 1;   // "ip:port"，客户端（手机/本机侧）
  string server_addr = 2;   // "ip:port"，服务端（游戏服务器）
  string network = 3;       // "tcp" | "udp"
  string app = 4;           // 应用/包名（可选）
  string device = 5;        // 设备标识（可选）
  string process_name = 6;  // 进程名（可选）
}

// ConnData 连接数据块：一个方向的原始字节（一次 TCP read 或应用分块）。
message ConnData {
  string direction = 1;     // "request"(client→server) | "response"(server→client)
  bytes payload = 2;
}

// ConnClose 连接关闭：插件可据此 flush 该连接的待组装缓冲。
message ConnClose {
  string reason = 1;        // 关闭原因（可选）
}

// PushResult 推送汇总统计。
message PushResult {
  uint64 connections = 1;   // 已接收连接数
  uint64 packets = 2;       // 已产出 Packet 数
  uint64 bytes = 3;         // 已接收字节数
  uint64 errors = 4;        // 错误/丢弃数
}
