api_version: gta.decoder/v2
name: four-layer-demo
protocol: demo-line
protocol_version: "1"
type: decoder
hints:
  - demo
  - line
  - tcp
  - port:9999
capabilities:
  decode: true
  schema: true
  state: true
  evidence: true
  rules: true
contract:
  name: gta.plugin
  version: 1
schemas:
  - id: demo.player
    version: 1
    name: demo player state
    description: A demo player entity (login + hp) used to exercise the four-layer semantic contract.
    strict: true
    fields:
      player_id:
        type: string
        semantic: entity_id
        entity:
          type: player
        description: Player identifier (entity id).
      name:
        type: string
        description: Player display name.
      hp:
        type: int64
        description: Current hit points.
states:
  - subject: player
    schema: demo.player
    version: 1
    id_field: player_id
    paths:
      - hp
evidence:
  - semantic: demo.observation.login
    kind: observation
    description: Observed player login, decoded from a LOGIN line.
    sources:
      - event
    method: decode
  - semantic: demo.observation.hp
    kind: observation
    description: Observed player hp change, decoded from an HP line.
    sources:
      - state_change
    method: decode
rules:
  - id: demo.auth.login-success
    topic: auth
    layer: domain
    severity: info
    statement: A successful login is observed when a LOGIN line decodes into a player.login event.
    detail: Correlates the LOGIN wire line with the resulting player.login event.
    doc_ref: docs/demo.md#login-success
    applies_to:
      - demo.player.v1
  - id: demo.combat.hp-change
    topic: combat
    layer: domain
    severity: warn
    statement: Player hit points changed when an HP line decodes into a player.hp event.
    detail: Tracks hp state changes across the session.
    doc_ref: docs/demo.md#hp-change
    applies_to:
      - demo.player.v1
meta:
  author: gta-demo
  description: >-
    Example decoder demonstrating a COMPLETE FOUR-LAYER semantic-contract
    declaration (schema + state + evidence + rules) on top of the mandatory
    decode capability. Decodes a trivial single-line TCP protocol on port 9999:
    "LOGIN <player_id> <name>" and "HP <player_id> <value>". Each decoded event
    carries a schema-conformant payload, a _state_changes entry, and an
    _evidence entry referencing a declared domain rule.
  game: demo
