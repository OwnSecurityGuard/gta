api_version: gta.decoder/v2
name: http
protocol: http
type: decoder
schemas:
  - id: "http.request.v1"
    version: 1
    indexable_fields:
      - path: "data.method"
        type: "string"
        alias: "method"
      - path: "data.path"
        type: "string"
        alias: "path"
  - id: "http.response.v1"
    version: 1
    indexable_fields:
      - path: "data.status"
        type: "int"
        alias: "status"
meta:
  author: gta
  description: Simple HTTP request/response decoder with body capture.
